log: true                          # Generates fabm_jobs.log to trace ordering/dependencies
#autofill: true                     # Automatically links unmapped standard variables
instances:
  light:
    model: gotm/light
    parameters:
      a:  0.58       # non-visible fraction of shortwave radiation, default =
      g1: 0.35        # e-folding depth of non-visible fraction, default =
      g2: 5.0        # e-folding depth of visible fraction, default =
  ergom:
    model: fmi/ergom
    coupling:
      dtdz: constant(0.0)
    parameters:
      temp_min_spp   : 3.0
    initialization:
      t_n2   : 520.0e-6
      t_o2   : 400.0e-6
      t_dic  : 1500.0e-6
      t_alk  : 0.00150279805529863
      t_nh4  : 0.10e-6
      t_no3  : 10.50e-6
      t_po4  : 1.e-6
      t_lpp  : 0.1e-6
      t_spp  : 0.1e-6
      t_cya  : 0.01e-6
      t_zoo  : 0.01e-6
      t_h2s  : 0.01e-6
      t_sul  : 0.01e-8
      t_ipw  : 0.01e-6
      t_det  : 0.01e-6
      t_cdom: 6.5e-6
      t_sed  : 0.1
      t_ips  : 0.1
      t_lip  : 0.1e-6
